#:schema https://dystroy.org/bacon/.bacon.schema.json

default_job = "run"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check"]
need_stdout = false

[jobs.check-all]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy"]
need_stdout = false

[jobs.clippy-all]
command = ["cargo", "clippy", "--all-targets"]
need_stdout = false

[jobs.pedantic]
command = ["cargo", "clippy", "--", "-W", "clippy::pedantic"]
need_stdout = false

[jobs.run]
command = ["cargo", "run", "--release", "--features", "esp32c5"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
scroll_anchor = "auto"

[keybindings]
c = "job:clippy-all"
r = "job:run"
